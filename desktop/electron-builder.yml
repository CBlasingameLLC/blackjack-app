appId: com.cblasingame.blackjackpro
productName: Blackjack Pro
copyright: Copyright (c) CBlasingame LLC

directories:
  output: release
  buildResources: build

# Named rather than left to the buildResources convention: an icon nobody
# points at and an icon that is missing produce the identical blank taskbar,
# and only one of them is visible in a diff. verify-icon.js asserts both lines
# are here for that reason.
icon: build/icon.ico

# The engine is NOT vendored into desktop/. `npm run dist` builds the shared
# renderer at the repo root first, and it is carried in as a resource - so the
# packaged app runs byte-identical files to the web and mobile builds.
extraResources:
  - from: ../dist
    to: renderer

files:
  - src/**/*
  - mcp/**/*
  - package.json

win:
  target:
    - target: nsis
      arch: [x64]
  # Unsigned by choice: first run shows a SmartScreen "unknown publisher"
  # prompt once. Signing is a certificate purchase, not a config change.
  # No spaces. ${productName} is "Blackjack Pro", and a filename with a space
  # in it cannot be pasted into Explorer or Run unquoted - which is exactly how
  # a perfectly good installer reads as a broken download link.
  artifactName: BlackjackPro-Setup-${version}.${ext}

nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Blackjack Pro

publish:
  provider: github
  owner: CBlasingameLLC
  repo: blackjack-app
